name: Build Caddy (Docker & Executable)

on:
  workflow_dispatch: # 随时支持在网页端手动点击一键触发
  push:
    branches:
      - main           # 当你修改代码提交时自动触发

jobs:
  # 任务 1：构建并推送 Docker 镜像到 ghcr.io
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy:latest

  # 任务 2：编译纯静态二进制文件并发布到 GitHub Releases
  build-binaries:
    name: Build & Release Standalone Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须具备写入权限以创建/更新 Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Standalone Binaries (AMD64 & ARM64)
        run: |
          mkdir -p dist

          # 编译 x86_64 (AMD64) 纯静态版本（适用于 PVE/普通 PC）
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 xcaddy build \
            --with github.com/caddy-dns/tencentcloud \
            --with github.com/caddy-dns/cloudflare \
            --with github.com/caddy-dns/alidns \
            --with github.com/mholt/caddy-webdav \
            --with github.com/caddyserver/cache-handler \
            --with github.com/caddyserver/replace-response \
            --with github.com/porech/caddy-maxmind-geolocation \
            --output dist/caddy-linux-amd64

          # 编译 aarch64 (ARM64) 纯静态版本（适用于 树莓派/ARM 软路由）
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 xcaddy build \
            --with github.com/caddy-dns/tencentcloud \
            --with github.com/caddy-dns/cloudflare \
            --with github.com/caddy-dns/alidns \
            --with github.com/mholt/caddy-webdav \
            --with github.com/caddyserver/cache-handler \
            --with github.com/caddyserver/replace-response \
            --with github.com/porech/caddy-maxmind-geolocation \
            --output dist/caddy-linux-arm64

          chmod +x dist/caddy-linux-*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Caddy Custom Build"
          body: "GitHub Actions 自动构建的带插件原生可执行文件（AMD64 / ARM64）"
          draft: false
          prerelease: false
          files: |
            dist/caddy-linux-amd64
            dist/caddy-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
